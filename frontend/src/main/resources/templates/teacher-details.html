<!DOCTYPE html>
<html xmlns:c="http://java.sun.com/jsp/jstl/core"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{_layouts/fixed-sidebar}">
<head>
  <title layout:fragment="header-title">Teacher Details</title>
</head>
<body>
<section layout:fragment="body-content-breadcrumb">
  <ol class="breadcrumb float-sm-end">
    <li class="breadcrumb-item active">Teacher Details</li>
  </ol>
</section>

<section layout:fragment="body-title">
  <h3 th:text="|${teacher.name} Details|"></h3>
</section>

<section class="content" layout:fragment="body-content-main">

    <form th:action="@{/teachers/update-teacher}" th:object="${teacher}" method="post">
      <input type="hidden" th:field="*{id}"/>
      <input th:if="${teacher.school} != null" type="hidden" th:field="*{school.id}"/>
      <input type="hidden" name="schoolId" th:if="${schoolId != null}" th:value="${schoolId}" />
      <div class="form-group">
        <label for="name">Teacher Name</label>
        <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="Enter teacher name" required/>
      </div>
      <div class="form-group">
        <label for="email">Teacher Email</label>
        <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="Enter teacher email" required/>
      </div>
      <div th:if="${teacher.school} != null" class="form-group">
        <label for="school">School</label>
        <input type="text" id="school" th:field="*{school.name}" class="form-control" disabled/>
      </div>
      <div th:if="${error}" th:text="${error}" class="text-danger mt-2"></div>
      <div th:if="${success}" th:text="${success}" class="text-success mt-2"></div>
      <button type="submit" class="btn btn-orange mt-3">Edit Data</button>
    </form>

    <a th:if="${schoolId} != null" class="btn btn-secondary mt-3" th:href="@{/schools/view/{id}(id=${schoolId})}">Back to List</a>
    <a th:if="${schoolId} == null" class="btn btn-secondary mt-3" th:href="@{/teachers}">Back to List</a>

</section>

<section layout:fragment="body_scripts" th:remove="tag">
</section>
</body>
</html>
