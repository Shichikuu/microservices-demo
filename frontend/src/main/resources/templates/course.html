<!DOCTYPE html>
<html xmlns:c="http://java.sun.com/jsp/jstl/core"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sd="http://www.thymeleaf.org/extras/springdata"
      layout:decorate="~{_layouts/fixed-sidebar}">
<head>
  <title layout:fragment="header-title"></title>
</head>
<body>
<section layout:fragment="body-content-breadcrumb">
  <ol class="breadcrumb float-sm-end">
    <li class="breadcrumb-item active">Courses</li>
  </ol>
</section>

<section layout:fragment="body-title">
  <h3>Course List</h3>
</section>

<section class="content" layout:fragment="body-content-main">
  <a class="btn btn-success mb-3" th:href="@{/learning/create-course}">Add New Course</a>
  <div class="box-tools">
    <form th:action="@{/learning/courses}" method="get">
      <div class="input-group input-group-sm mb-3" style="width: 250px;">
        <input type="text" name="value" class="form-control pull-right"
               placeholder="Search" th:if="${key} == null"/>
        <input type="text" name="value" class="form-control pull-right"
               placeholder="Search" th:if="${key} != null"
               th:value="${key}"/>
        <div class="input-group-btn">
          <button type="submit" class="btn btn-default"><i class="fa fa-search"></i></button>
        </div>
      </div>
    </form>
    <table class="table table-bordered table-hover">
      <thead>
      <tr>
        <th scope="col"><a class="fa fa-fw fa-sort"></a><a class="sorted" sd:pagination-sort="id">Course Code</a></th>
        <th scope="col"><a class="fa fa-fw fa-sort"></a><a class="sorted" sd:pagination-sort="name">Course Name</a></th>
        <th>Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="course : ${courses}">
        <td th:text="${course.id}"></td>
        <td th:text="${course.name}"></td>
        <td>
<!--          <a class="btn btn-danger btn-sm" th:href="@{/learning/courses/delete(courseId=${course.id})}"-->
<!--             onclick="return confirm('Are you sure you want to delete this course?');">Delete</a>-->
          <a class="btn btn-success btn-sm" th:href="@{/learning/courses/view(studentId=${course.id})}">View Details</a>
        </td>
      </tr>
      </tbody>
    </table>
    <div th:if="${error}" th:text="${error}" class="text-danger mt-2"></div>
    <div th:if="${success}" th:text="${success}" class="text-success mt-2"></div>
    <div th:if="${not #lists.isEmpty(courses.content)}">

      <div sd:pagination-summary="">info</div>
      <div class="text-center">
        <nav>
          <ul class="pagination" sd:pagination="full">
            <!-- Pagination created by SpringDataDialect, this content is just for mockup -->
            <li class="disabled"><a href="#" aria-label="Previous"><span
                    aria-hidden="true">&laquo;</span></a></li>
            <li class="active"><a href="#">1 <span class="sr-only">(current)</span></a></li>
          </ul>
        </nav>
      </div>
    </div>
</section>

<section layout:fragment="body_scripts" th:remove="tag">
</section>
</body>
</html>
