<!DOCTYPE html>
<html xmlns:c="http://java.sun.com/jsp/jstl/core"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{_layouts/fixed-sidebar}">
<head>
  <title layout:fragment="header-title">Add New Course</title>
</head>
<body>
<section layout:fragment="body-content-breadcrumb">
  <ol class="breadcrumb float-sm-end">
    <li class="breadcrumb-item active">Add New Course</li>
  </ol>
</section>

<section layout:fragment="body-title">
  <h3>Add New Course</h3>
</section>

<section class="content" layout:fragment="body-content-main">

  <div class="container mb-5">
    <form th:action="@{/learning/create-course}" th:object="${course}" method="post">
      <div class="form-group">
        <label for="name">Course Name</label>
        <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="Enter course name" required/>
      </div>
      <button type="submit" class="btn btn-orange mt-3">Create</button>
    </form>
    <a class="btn btn-secondary mt-3" th:href="@{/learning/courses}">Back to List</a>
</section>

<section layout:fragment="body_scripts" th:remove="tag">
</section>
</body>
</html>
