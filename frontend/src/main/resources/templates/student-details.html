<!DOCTYPE html>
<html xmlns:c="http://java.sun.com/jsp/jstl/core"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{_layouts/fixed-sidebar}">
<head>
  <title layout:fragment="header-title">Student Details</title>
</head>
<body>
<section layout:fragment="body-content-breadcrumb">
  <ol class="breadcrumb float-sm-end">
    <li class="breadcrumb-item active">Student Details</li>
  </ol>
</section>

<section layout:fragment="body-title">
  <h3 th:text="|${student.name} Details|"></h3>
</section>

<section class="content" layout:fragment="body-content-main">

    <form th:action="@{/students/update-student-data}" th:object="${student}" method="post">
      <input type="hidden" th:field="*{id}"/>
      <input th:if="*{school} != null" type="hidden" th:field="*{school.id}"/>
      <input th:if="*{classroom} != null" type="hidden" th:field="*{classroom.id}"/>
      <div class="form-group">
        <label for="name">Student Name</label>
        <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="Enter student name" required/>
      </div>
      <div class="form-group">
        <label for="email">Student Email</label>
        <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="Enter student email" required/>
      </div>
      <div th:if="${error}" th:text="${error}" class="text-danger mt-2"></div>
      <div th:if="${success}" th:text="${success}" class="text-success mt-2"></div>
      <button type="submit" class="btn btn-orange mt-3">Edit Data</button>
    </form>

    <div class="box-tools mt-3">
      <div class="d-flex justify-content-between mb-3">
        <form class="align-middle" th:action="@{/students/view(studentId=${student.id})}" method="get">
          <input type="hidden" name="studentId" th:value="${student.id}" />
          <div class="input-group input-group-sm" style="width: 25vw;">
            <input type="text" name="value" class="form-control pull-right"
                   placeholder="Search" th:if="${key} == null"/>
            <input type="text" name="value" class="form-control pull-right"
                   placeholder="Search" th:if="${key} != null"
                   th:value="${key}"/>
            <div class="input-group-btn">
              <button type="submit" class="btn btn-secondary"><i class="fa fa-search"></i></button>
            </div>
          </div>
        </form>
      </div>
      <table class="table table-bordered table-hover table-striped">
        <thead>
        <tr>
          <th scope="col"><a class="fa fa-fw fa-sort text-decoration-none" style="color: #5e5e5e !important;"></a><a class="sorted text-decoration-none" sd:pagination-sort="date" style="color: #5e5e5e !important;">Period</a></th>
          <th scope="col"><a class="fa fa-fw fa-sort text-decoration-none" style="color: #5e5e5e !important;"></a><a class="sorted text-decoration-none" sd:pagination-sort="course.id" style="color: #5e5e5e !important;">Course Code</a></th>
          <th scope="col"><a class="fa fa-fw fa-sort text-decoration-none" style="color: #5e5e5e !important;"></a><a class="sorted text-decoration-none" sd:pagination-sort="course.name" style="color: #5e5e5e !important;">Course</a></th>
          <th scope="col"><a class="fa fa-fw fa-sort text-decoration-none" style="color: #5e5e5e !important;"></a><a class="sorted text-decoration-none" sd:pagination-sort="score" style="color: #5e5e5e !important;">Score</a></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="score : ${courseScores}">
          <td th:text="|${score.year}, ${score.semester}|"></td>
          <td th:text="${score.course.id}"></td>
          <td th:text="${score.course.name}"></td>
          <td th:text="${score.score}"></td>
        </tr>
        </tbody>
      </table>
      <a class="btn btn-secondary mt-3" th:href="@{/students}">Back to List</a>
    </div>



</section>

<section layout:fragment="body_scripts" th:remove="tag">
</section>
</body>
</html>
