<!DOCTYPE html>
<html xmlns:c="http://java.sun.com/jsp/jstl/core"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{_layouts/fixed-sidebar}">
<head>
  <title layout:fragment="header-title"></title>
</head>
<body>
<section layout:fragment="body-content-breadcrumb">
  <ol class="breadcrumb float-sm-end">
    <li class="breadcrumb-item active">School Details</li>
  </ol>
</section>

<section layout:fragment="body-title">
  <h3 th:text="${school.name}"></h3>
</section>

<section class="content" layout:fragment="body-content-main">
  <div class="row">
    <div class="col-12 col-sm-6">
      <div class="info-box">
                    <span class="info-box-icon text-bg-warning shadow-sm">
                      <i class="bi bi-people-fill"></i>
                    </span>
        <div class="info-box-content">
          <span class="info-box-text">Students</span>
          <span class="info-box-number" th:text="${students.totalElements}"></span>
        </div>
        <!-- /.info-box-content -->
      </div>
      <!-- /.info-box -->
    </div>
    <div class="col-12 col-sm-6">
      <div class="info-box">
                    <span class="info-box-icon text-bg-warning shadow-sm">
                      <i class="bi bi-people-fill"></i>
                    </span>
        <div class="info-box-content">
          <span class="info-box-text">Teachers</span>
          <span class="info-box-number" th:text="${teachers.totalElements}"></span>
        </div>
        <!-- /.info-box-content -->
      </div>
      <!-- /.info-box -->
    </div>
  </div>
  <div class="card">
    <div class="card-body">
      <a class="btn btn-success mb-3" th:href="@{/classrooms/new(schoolId=${school.id})}">Add New Classroom</a>
      <table class="table">
        <thead>
        <tr>
          <th scope="col">Id</th>
          <th scope="col">Class Name</th>
          <th scope="col">Assigned Teacher</th>
          <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="classroom : ${school.classrooms}">
          <td th:text="${classroom.id}"></td>
          <td th:text="${classroom.name}"></td>
          <td th:text="${classroom.teacher != null ? classroom.teacher.name : ''}"></td>
          <td>
            <a class="btn btn-danger btn-sm" th:href="@{/classrooms/delete(classroomId=${classroom.id}, schoolId=${school.id})}"
               onclick="return confirm('Are you sure you want to delete this classroom?');">Delete</a>
            <a class="btn btn-success btn-sm" th:href="@{/classrooms/view/{id}(id=${classroom.id})}">View Details</a>
          </td>
        </tr>
        </tbody>
      </table>
      <div th:if="${classroomError}" th:text="${classroomError}" class="text-danger mt-2"></div>
        <div th:if="${classroomSuccess}" th:text="${classroomSuccess}" class="text-success mt-2"></div>
    </div>
  </div>

  <div class="card mt-3" sd:page-object="${students}" sd:pagination-qualifier="studentPageable">
    <div class="card-body">
      <a class="btn btn-success mb-3" th:href="@{/schools/{id}/insert-student(id=${school.id})}">Add New Student</a>
      <table class="table table-bordered table-hover">
        <thead>
        <tr>
          <th scope="col"><a class="fa fa-fw fa-sort text-decoration-none"></a><a class="sorted text-decoration-none" sd:pagination-sort="id">Id</a></th>
          <th scope="col"><a class="fa fa-fw fa-sort text-decoration-none"></a><a class="sorted text-decoration-none" sd:pagination-sort="name">Name</a></th>
          <th scope="col"><a class="fa fa-fw fa-sort text-decoration-none"></a><a class="sorted text-decoration-none" sd:pagination-sort="email">Email</a></th>
          <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="student : ${students}">
          <td th:text="${student.id}"></td>
          <td th:text="${student.name}"></td>
          <td th:text="${student.email}"></td>
          <td>
            <a class="btn btn-danger btn-sm" th:href="@{/schools/{id}/remove-student(id=${school.id},studentId=${student.id})}"
               onclick="return confirm('Are you sure you want to delete this student record from the school?');">Remove</a>
            <a class="btn btn-success btn-sm" th:href="@{/learning/report(studentId=${student.id})}">View Details</a>
          </td>
        </tr>
        </tbody>
      </table>
      <div th:if="${studentError}" th:text="${studentError}" class="text-danger mt-2"></div>
      <div th:if="${studentSuccess}" th:text="${studentSuccess}" class="text-success mt-2"></div>
      <div th:if="${not #lists.isEmpty(students.content)}">

        <div sd:pagination-summary="">info</div>
        <div class="text-center">
          <nav>
            <ul class="pagination" sd:pagination="full">
              <!-- Pagination created by SpringDataDialect, this content is just for mockup -->
              <li class="disabled"><a href="#" aria-label="Previous"><span
                      aria-hidden="true">&laquo;</span></a></li>
              <li class="active"><a href="#">1 <span class="sr-only">(current)</span></a></li>
            </ul>
          </nav>
        </div>
      </div>
    </div>
  </div>

  <div class="card mt-3" sd:page-object="${teachers}" sd:pagination-qualifier="teacherPageable">
    <div class="card-body">
      <a class="btn btn-success mb-3" th:href="@{/teachers/insert-teacher(schoolId=${school.id})}">Add New Teacher</a>
      <table class="table table-bordered table-hover">
        <thead>
        <tr>
          <th scope="col"><a class="fa fa-fw fa-sort text-decoration-none"></a><a class="text-decoration-none sorted" sd:pagination-sort="id">Id</a></th>
          <th scope="col"><a class="fa fa-fw fa-sort text-decoration-none"></a><a class="text-decoration-none sorted" sd:pagination-sort="name">Name</a></th>
          <th scope="col"><a class="fa fa-fw fa-sort text-decoration-none"></a><a class="text-decoration-none sorted" sd:pagination-sort="email">Email</a></th>
          <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="teacher : ${teachers}">
          <td th:text="${teacher.id}"></td>
          <td th:text="${teacher.name}"></td>
          <td th:text="${teacher.email}"></td>
          <td>
            <a class="btn btn-danger btn-sm" th:href="@{/teachers/remove-from-school(teacherId=${teacher.id}, schoolId=${school.id})}"
               onclick="return confirm('Are you sure you want to remove this teacher from this school?');">Remove</a>
            <a class="btn btn-success btn-sm" th:href="@{/teachers/view(teacherId=${teacher.id}, schoolId=${school.id})}">View Details</a>
          </td>
        </tr>
        </tbody>
      </table>
      <div th:if="${teacherError}" th:text="${teacherError}" class="text-danger mt-2"></div>
        <div th:if="${teacherSuccess}" th:text="${teacherSuccess}" class="text-success mt-2"></div>
      <div th:if="${not #lists.isEmpty(teachers.content)}">

        <div sd:pagination-summary="">info</div>
        <div class="text-center">
          <nav>
            <ul class="pagination" sd:pagination="full">
              <!-- Pagination created by SpringDataDialect, this content is just for mockup -->
              <li class="disabled"><a href="#" aria-label="Previous"><span
                      aria-hidden="true">&laquo;</span></a></li>
              <li class="active"><a href="#">1 <span class="sr-only">(current)</span></a></li>
            </ul>
          </nav>
        </div>
      </div>
    </div>
  </div>

  <a class="btn btn-secondary mt-3" th:href="@{/schools}">Back to List</a>

</section>

<section layout:fragment="body_scripts" th:remove="tag">
</section>
</body>
</html>
